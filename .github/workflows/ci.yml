name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gleam-to-clj
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.14.0"
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Rosetta content is GFDL so it is not committed; CI fetches it once
      # into the private Actions cache (a build artifact, not redistribution)
      # and the harness verifies it like any other corpus.
      - uses: actions/cache@v4
        with:
          path: rosetta/tasks
          key: rosetta-tasks-v1
      - name: Fetch Rosetta corpus on cache miss
        run: |
          if ! ls rosetta/tasks/*.gleam >/dev/null 2>&1; then
            python3 rosetta/scrape.py
          fi
      - run: ./check.sh
